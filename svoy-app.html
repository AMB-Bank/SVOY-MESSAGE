<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>СВОЙ</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--panel:#fff;--line:#e1e6f2;--ink:#131a2e;--mut:#6b7794;--blue:#2b69bd;--red:#ce2029;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--panel:#121a30;--line:#223055;--ink:#eef1fb;--mut:#8b9ac2}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;height:100vh;overflow:hidden}
.hide{display:none!important}
#auth{max-width:360px;margin:12vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
#auth h1{font-size:22px;margin:0 0 4px;text-align:center}.svo{color:var(--red)}.y{color:var(--blue)}
#auth p.s{text-align:center;color:var(--mut);margin:0 0 20px;font-size:13px}
#auth input{width:100%;padding:11px 12px;margin:6px 0;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);font-size:14px}
#auth button{width:100%;padding:11px;margin-top:10px;border:none;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
#auth .sw{margin-top:14px;text-align:center;font-size:13px;color:var(--mut)}#auth .sw a{color:var(--blue);cursor:pointer}
#err{color:var(--red);font-size:13px;min-height:18px;text-align:center}
#app{display:none;height:100%;grid-template-columns:280px 1fr}
#app.on{display:grid}
#side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#side header{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
#side header img{width:26px;height:26px}#side header b{font-size:15px}
#side header button{margin-left:auto;border:none;background:none;color:var(--mut);cursor:pointer;font-size:12px}
#users{overflow:auto;flex:1}
.u{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.u:hover{background:var(--bg)}.u .dot{width:9px;height:9px;border-radius:50%;background:#9aa6c2;flex:none}
.u .dot.on{background:#2eb872}.u .n{font-size:14px}.u .l{font-size:12px;color:var(--mut)}
#chat{display:flex;flex-direction:column}
#chead{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
#chead b{color:var(--ink);font-size:14.5px}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:62%;padding:9px 13px;border-radius:13px;font-size:14px;line-height:1.4}
.m.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.m.th{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:3px}
.m .t{display:block;font-size:10.5px;opacity:.65;margin-top:3px}
#send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
#send input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#send button{padding:0 18px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
#empty{margin:auto;color:var(--mut);text-align:center;font-size:14px}
</style></head><body>

<div id="auth">
<h1><span class="svo">СВО</span><span class="y">Й</span></h1>
<p class="s">Связь, которая объединяет</p>
<input id="name" placeholder="Имя (при регистрации)">
<input id="email" placeholder="Электронная почта" type="email">
<input id="pass" placeholder="Пароль" type="password">
<div id="err"></div>
<button id="go">Войти</button>
<div class="sw">Нет аккаунта? <a id="toggle">Зарегистрироваться</a></div>
</div>

<div id="app">
<div id="side"><header><img src="icons/icon-192.png" alt=""><b><span class="svo">СВО</span><span class="y">Й</span></b><button id="out">Выйти</button></header>
<div id="users"></div></div>
<div id="chat">
<div id="chead"><span id="cname">Выберите собеседника</span></div>
<div id="msgs"><div id="empty">Сообщения появятся здесь</div></div>
<div id="send" class="hide"><input id="txt" placeholder="Написать сообщение…"><button id="snd">Отправить</button></div>
</div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyCcicQSLYnBPQ_R-_eEul--2VK77v3TwCQ",authDomain:"respzonasite.firebaseapp.com",databaseURL:"https://respzonasite-default-rtdb.firebaseio.com",projectId:"respzonasite",storageBucket:"respzonasite.firebasestorage.app",messagingSenderId:"308009742152",appId:"1:308009742152:web:325b8e3ae2ee840542cd7d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database();
let mode='login', me=null, peer=null, chatId=null, msgsRef=null;

document.getElementById('toggle').onclick=()=>{mode=mode==='login'?'register':'login';
  document.getElementById('go').textContent=mode==='login'?'Войти':'Создать аккаунт';
  document.getElementById('toggle').textContent=mode==='login'?'Зарегистрироваться':'Войти';
  document.querySelector('.sw').firstChild.textContent=mode==='login'?'Нет аккаунта? ':'Уже есть аккаунт? ';};

document.getElementById('go').onclick=async()=>{
  const email=document.getElementById('email').value.trim(), pass=document.getElementById('pass').value, name=document.getElementById('name').value.trim();
  const err=document.getElementById('err'); err.textContent='';
  try{
    if(mode==='register'){
      if(!name){err.textContent='Укажите имя';return;}
      const cred=await auth.createUserWithEmailAndPassword(email,pass);
      await db.ref('profiles/'+cred.user.uid).set({name,email,createdAt:Date.now()});
    } else { await auth.signInWithEmailAndPassword(email,pass); }
  }catch(e){ err.textContent=translateErr(e.code); }
};
function translateErr(c){
  const m={'auth/email-already-in-use':'Эта почта уже зарегистрирована','auth/invalid-email':'Неверный формат почты',
  'auth/weak-password':'Пароль слишком короткий (мин. 6 символов)','auth/user-not-found':'Пользователь не найден',
  'auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверная почта или пароль'};
  return m[c]||'Ошибка входа';
}
document.getElementById('out').onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
  if(user){ me=user; document.getElementById('auth').classList.add('hide'); document.getElementById('app').classList.add('on');
    const pres=db.ref('presence/'+user.uid);
    db.ref('.info/connected').on('value',s=>{ if(s.val()){ pres.onDisconnect().set({online:false,last:firebase.database.ServerValue.TIMESTAMP}); pres.set({online:true,last:firebase.database.ServerValue.TIMESTAMP}); }});
    loadUsers();
  } else { document.getElementById('auth').classList.remove('hide'); document.getElementById('app').classList.remove('on'); }
});

function loadUsers(){
  db.ref('profiles').on('value',snap=>{
    const list=document.getElementById('users'); list.innerHTML='';
    snap.forEach(c=>{
      if(c.key===me.uid) return;
      const p=c.val(), el=document.createElement('div'); el.className='u';
      el.innerHTML='<span class="dot" id="dot-'+c.key+'"></span><div><div class="n">'+esc(p.name)+'</div><div class="l">'+esc(p.email)+'</div></div>';
      el.onclick=()=>openChat(c.key,p.name);
      list.appendChild(el);
      db.ref('presence/'+c.key+'/online').on('value',s=>{const d=document.getElementById('dot-'+c.key); if(d) d.classList.toggle('on',!!s.val());});
    });
  });
}
function esc(s){return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

function openChat(uid,name){
  peer=uid; chatId=[me.uid,uid].sort().join('_');
  document.getElementById('cname').textContent=name;
  document.getElementById('send').classList.remove('hide');
  if(msgsRef) msgsRef.off();
  msgsRef=db.ref('chats/'+chatId+'/messages');
  const box=document.getElementById('msgs'); box.innerHTML='';
  msgsRef.limitToLast(200).on('child_added',snap=>{
    const m=snap.val(), d=document.createElement('div'); d.className='m '+(m.from===me.uid?'me':'th');
    d.innerHTML=esc(m.text)+'<span class="t">'+new Date(m.ts||Date.now()).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</span>';
    box.appendChild(d); box.scrollTop=box.scrollHeight;
  });
}
document.getElementById('snd').onclick=send;
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
function send(){
  const i=document.getElementById('txt'); const t=i.value.trim(); if(!t||!chatId) return;
  db.ref('chats/'+chatId+'/messages').push({from:me.uid,text:t,ts:firebase.database.ServerValue.TIMESTAMP});
  db.ref('chats/'+chatId+'/meta').set({members:{[me.uid]:true,[peer]:true},lastText:t,lastTs:firebase.database.ServerValue.TIMESTAMP});
  i.value='';
}
</script></body></html>
