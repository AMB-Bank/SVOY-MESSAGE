<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>СВОЙ</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-storage-compat.js"></script>
<style>
:root{color-scheme:light dark;--bg:#eef1f8;--panel:#fff;--panel2:#f5f7fc;--line:#e1e6f2;--ink:#131a2e;--mut:#6b7794;--blue:#2b69bd;--blue-d:#1e4f94;--red:#ce2029;--bub:#eef1f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--panel:#121a30;--panel2:#0e1526;--line:#223055;--ink:#eef1fb;--mut:#8b9ac2;--bub:#1a2340}}
:root[data-theme="dark"]{--bg:#0b1020;--panel:#121a30;--panel2:#0e1526;--line:#223055;--ink:#eef1fb;--mut:#8b9ac2;--bub:#1a2340}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;height:100vh;overflow:hidden}
.hide{display:none!important}
.svo{color:var(--red)}.y{color:var(--blue)}
#auth{max-width:360px;margin:10vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
#auth h1{font-size:22px;margin:0 0 4px;text-align:center}
#auth p.s{text-align:center;color:var(--mut);margin:0 0 6px;font-size:13px}
.tag{text-align:center;color:var(--mut);font-size:11.5px;margin:0 0 18px;font-style:italic}
#auth input{width:100%;padding:11px 12px;margin:6px 0;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);font-size:14px}
#auth button{width:100%;padding:11px;margin-top:10px;border:none;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
#auth .sw{margin-top:14px;text-align:center;font-size:13px;color:var(--mut)}#auth .sw a{color:var(--blue);cursor:pointer}
#err{color:var(--red);font-size:13px;min-height:18px;text-align:center}
.tri{height:3px;display:flex;border-radius:3px;overflow:hidden;margin:0 0 16px}
.tri i{flex:1}.tri i:nth-child(1){background:#fff;border:1px solid var(--line)}.tri i:nth-child(2){background:var(--blue)}.tri i:nth-child(3){background:var(--red)}
#app{display:none;height:100%;grid-template-columns:300px 1fr}
#app.on{display:grid}
#side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#side header{padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh-top b{font-size:15px}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;background:var(--blue);overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
#side header button{margin-left:auto;border:none;background:none;color:var(--mut);cursor:pointer;font-size:17px}
#search{width:100%;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:13.5px}
#users{overflow:auto;flex:1}
.u{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.u:hover{background:var(--panel2)}.u .av-wrap{position:relative}
.dot{width:9px;height:9px;border-radius:50%;background:#9aa6c2;position:absolute;right:-1px;bottom:-1px;border:2px solid var(--panel)}
.dot.on{background:#2eb872}
.u .n{font-size:14px;font-weight:600}.u .l{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
#chat{display:flex;flex-direction:column;position:relative}
#chead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#chead .ct{display:flex;flex-direction:column}#chead b{font-size:14.5px}#chead span{font-size:12px;color:var(--mut)}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
.m{max-width:66%;padding:9px 12px;border-radius:13px;font-size:14px;line-height:1.4;position:relative}
.m.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.m.th{align-self:flex-start;background:var(--bub);border:1px solid var(--line);border-bottom-left-radius:3px}
.m .t{display:block;font-size:10.5px;opacity:.65;margin-top:3px}
.m a.file{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;font-size:13.5px}
.m a.file .fi{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
#send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center}
#send input[type=text]{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#send button{padding:0 16px;height:40px;border:none;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
#attach{background:none;border:none;color:var(--mut);font-size:19px;cursor:pointer;padding:0 4px}
#empty{margin:auto;color:var(--mut);text-align:center;font-size:14px}
#profile{position:fixed;top:0;right:-340px;width:320px;max-width:92vw;height:100%;background:var(--panel);border-left:1px solid var(--line);transition:right .25s;z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#profile.on{right:0}
#profile .ph{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#profile .ph b{font-size:15px}#profile .ph button{margin-left:auto;border:none;background:none;font-size:18px;color:var(--mut);cursor:pointer}
#profile .pbody{padding:18px;overflow:auto;flex:1}
#profile .pav{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;background:var(--blue);overflow:hidden;cursor:pointer;position:relative}
#profile .pav img{width:100%;height:100%;object-fit:cover}
#profile .pname{text-align:center;font-weight:700;font-size:16px}
#profile .pmail{text-align:center;color:var(--mut);font-size:12.5px;margin-bottom:18px}
#profile h4{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 8px}
.theme-row{display:flex;gap:6px}
.theme-row button{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12.5px;cursor:pointer}
.theme-row button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
#invlink{display:flex;gap:6px}
#invlink input{flex:1;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:12px}
#invlink button{padding:0 12px;border-radius:9px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-size:12.5px}
#logout{width:100%;margin-top:26px;padding:10px;border-radius:9px;border:1px solid var(--red);color:var(--red);background:none;font-weight:600;cursor:pointer}
.quote{font-size:11px;color:var(--mut);text-align:center;padding:10px;font-style:italic;border-top:1px solid var(--line)}
@media(max-width:720px){#app.on{grid-template-columns:1fr}#side.chat-open{display:none}#chat.chat-closed{display:none}}
</style></head><body>

<div id="auth">
<h1><span class="svo">СВО</span><span class="y">Й</span></h1>
<p class="s">Связь, которая объединяет</p>
<div class="tri"><i></i><i></i><i></i></div>
<input id="name" placeholder="Имя (при регистрации)">
<input id="email" placeholder="Электронная почта" type="email">
<input id="pass" placeholder="Пароль" type="password">
<div id="err"></div>
<button id="go">Войти</button>
<div class="sw">Нет аккаунта? <a id="toggle">Зарегистрироваться</a></div>
</div>

<div id="app">
<div id="side">
<header>
<div class="sh-top">
<div class="avatar" id="myAvBtn">?</div>
<b><span class="svo">СВО</span><span class="y">Й</span></b>
<button id="openProfile" title="Профиль">⚙</button>
</div>
<input id="search" placeholder="Поиск по имени…">
</header>
<div id="users"></div>
<div class="quote" id="quote"></div>
</div>
<div id="chat">
<div id="chead"><span id="empty2"></span>
<div class="avatar hide" id="chAv"></div>
<div class="ct hide" id="chInfo"><b id="cname"></b><span id="cstat"></span></div>
</div>
<div id="msgs"><div id="empty">Выберите собеседника слева</div></div>
<div id="send" class="hide">
<button id="attach" title="Прикрепить файл">📎</button>
<input type="file" id="file" class="hide">
<input type="text" id="txt" placeholder="Написать сообщение…">
<button id="snd">➤</button>
</div>
</div>
</div>

<div id="profile">
<div class="ph"><b>Профиль</b><button id="closeProfile">✕</button></div>
<div class="pbody">
<div class="pav" id="pav">?</div>
<input type="file" id="avFile" class="hide">
<div class="pname" id="pname"></div>
<div class="pmail" id="pmail"></div>
<h4>Оформление</h4>
<div class="theme-row">
<button data-t="light">Светлая</button>
<button data-t="dark">Тёмная</button>
<button data-t="system">Системная</button>
</div>
<h4>Пригласить в СВОЙ</h4>
<div id="invlink"><input id="invurl" readonly><button id="invcopy">Копировать</button></div>
<button id="logout">Выйти из аккаунта</button>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCcicQSLYnBPQ_R-_eEul--2VK77v3TwCQ",authDomain:"respzonasite.firebaseapp.com",databaseURL:"https://respzonasite-default-rtdb.firebaseio.com",projectId:"respzonasite",storageBucket:"respzonasite.firebasestorage.app",messagingSenderId:"308009742152",appId:"1:308009742152:web:325b8e3ae2ee840542cd7d"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database(), storage=firebase.storage();
let mode='login', me=null, myProfile={}, peer=null, chatId=null, msgsRef=null;
const QUOTES=["Своих не бросаем","Связь, которая объединяет","Вместе — сильнее","Рядом, даже на расстоянии"];
document.getElementById('quote').textContent=QUOTES[Math.floor(Math.random()*QUOTES.length)];

// theme
function applyTheme(t){ if(t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.theme-row button').forEach(b=>b.classList.toggle('sel', b.dataset.t===t)); }
try{ applyTheme(localStorage.getItem('svoy_theme')||'system'); }catch(e){ applyTheme('system'); }
document.querySelectorAll('.theme-row button').forEach(b=>{ b.onclick=()=>{ applyTheme(b.dataset.t); try{localStorage.setItem('svoy_theme',b.dataset.t);}catch(e){} }; });

document.getElementById('toggle').onclick=()=>{mode=mode==='login'?'register':'login';
  document.getElementById('go').textContent=mode==='login'?'Войти':'Создать аккаунт';
  document.getElementById('toggle').textContent=mode==='login'?'Зарегистрироваться':'Войти';
  document.querySelector('.sw').firstChild.textContent=mode==='login'?'Нет аккаунта? ':'Уже есть аккаунт? ';};

document.getElementById('go').onclick=async()=>{
  const email=document.getElementById('email').value.trim(), pass=document.getElementById('pass').value, name=document.getElementById('name').value.trim();
  const err=document.getElementById('err'); err.textContent='';
  try{
    if(mode==='register'){
      if(!name){err.textContent='Укажите имя';return;}
      const cred=await auth.createUserWithEmailAndPassword(email,pass);
      await db.ref('profiles/'+cred.user.uid).set({name,email,createdAt:Date.now()});
    } else { await auth.signInWithEmailAndPassword(email,pass); }
  }catch(e){ err.textContent=translateErr(e.code); }
};
function translateErr(c){
  const m={'auth/email-already-in-use':'Эта почта уже зарегистрирована','auth/invalid-email':'Неверный формат почты',
  'auth/weak-password':'Пароль слишком короткий (мин. 6 символов)','auth/user-not-found':'Пользователь не найден',
  'auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверная почта или пароль',
  'auth/configuration-not-found':'Authentication не включён в Firebase Console'};
  return m[c]||'Ошибка входа';
}
function initials(n){ return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function colorFor(uid){ let h=0; for(const c of (uid||'')) h=(h*31+c.charCodeAt(0))%360; return 'hsl('+h+',55%,46%)'; }
function esc(s){return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
function fmtSize(b){ if(b<1024) return b+' Б'; if(b<1048576) return (b/1024).toFixed(0)+' КБ'; return (b/1048576).toFixed(1)+' МБ'; }

function renderAvatarInto(el,uid,name,photoURL){
  el.style.background=colorFor(uid);
  if(photoURL){ el.innerHTML='<img src="'+photoURL+'">'; } else { el.textContent=initials(name); }
}

document.getElementById('out')?.remove();
document.getElementById('logout').onclick=()=>auth.signOut();
document.getElementById('openProfile').onclick=()=>document.getElementById('profile').classList.add('on');
document.getElementById('closeProfile').onclick=()=>document.getElementById('profile').classList.remove('on');
document.getElementById('pav').onclick=()=>document.getElementById('avFile').click();
document.getElementById('avFile').onchange=async(e)=>{
  const f=e.target.files[0]; if(!f||!me) return;
  if(f.size>5*1024*1024){ alert('Фото слишком большое (максимум 5 МБ)'); return; }
  const ref=storage.ref('avatars/'+me.uid); await ref.put(f);
  const url=await ref.getDownloadURL();
  await db.ref('profiles/'+me.uid+'/photoURL').set(url);
};
document.getElementById('invcopy').onclick=()=>{
  const i=document.getElementById('invurl'); i.select();
  navigator.clipboard?.writeText(i.value).catch(()=>{});
};

let pendingInvite=null;
try{ const p=new URLSearchParams(location.search).get('invite'); if(p) pendingInvite=p; }catch(e){}

auth.onAuthStateChanged(user=>{
  if(user){ me=user; document.getElementById('auth').classList.add('hide'); document.getElementById('app').classList.add('on');
    document.getElementById('invurl').value=location.origin+location.pathname+'?invite='+user.uid;
    const pres=db.ref('presence/'+user.uid);
    db.ref('.info/connected').on('value',s=>{ if(s.val()){ pres.onDisconnect().set({online:false,last:firebase.database.ServerValue.TIMESTAMP}); pres.set({online:true,last:firebase.database.ServerValue.TIMESTAMP}); }});
    db.ref('profiles/'+user.uid).on('value',s=>{ myProfile=s.val()||{}; document.getElementById('pname').textContent=myProfile.name||''; document.getElementById('pmail').textContent=myProfile.email||'';
      renderAvatarInto(document.getElementById('myAvBtn'),user.uid,myProfile.name,myProfile.photoURL);
      renderAvatarInto(document.getElementById('pav'),user.uid,myProfile.name,myProfile.photoURL); });
    loadUsers();
  } else { document.getElementById('auth').classList.remove('hide'); document.getElementById('app').classList.remove('on'); }
});

let allUsers={};
function loadUsers(){
  db.ref('profiles').on('value',snap=>{
    allUsers={}; snap.forEach(c=>{ if(c.key!==me.uid) allUsers[c.key]=c.val(); });
    renderUsers(document.getElementById('search').value.trim().toLowerCase());
    Object.keys(allUsers).forEach(uid=>{
      db.ref('presence/'+uid+'/online').on('value',s=>{const d=document.getElementById('dot-'+uid); if(d) d.classList.toggle('on',!!s.val());});
    });
    if(pendingInvite && allUsers[pendingInvite]){ openChat(pendingInvite, allUsers[pendingInvite].name); pendingInvite=null; }
  });
}
document.getElementById('search').oninput=e=>renderUsers(e.target.value.trim().toLowerCase());
function renderUsers(q){
  const list=document.getElementById('users'); list.innerHTML='';
  Object.entries(allUsers).filter(([,p])=>!q||((p.name||'').toLowerCase().includes(q))).forEach(([uid,p])=>{
    const el=document.createElement('div'); el.className='u';
    el.innerHTML='<div class="av-wrap"><div class="avatar" style="width:38px;height:38px;font-size:13px">'+ (p.photoURL?'<img src="'+p.photoURL+'">':initials(p.name)) +'</div><span class="dot" id="dot-'+uid+'"></span></div><div><div class="n">'+esc(p.name)+'</div><div class="l">'+esc(p.email)+'</div></div>';
    el.querySelector('.avatar').style.background=colorFor(uid);
    el.onclick=()=>openChat(uid,p.name,p.photoURL);
    list.appendChild(el);
  });
}

function openChat(uid,name,photoURL){
  peer=uid; chatId=[me.uid,uid].sort().join('_');
  document.getElementById('empty2').remove?.();
  document.getElementById('chAv').classList.remove('hide'); document.getElementById('chInfo').classList.remove('hide');
  renderAvatarInto(document.getElementById('chAv'),uid,name,photoURL);
  document.getElementById('cname').textContent=name;
  db.ref('presence/'+uid+'/online').once('value').then(s=>document.getElementById('cstat').textContent=s.val()?'в сети':'не в сети');
  document.getElementById('send').classList.remove('hide');
  if(msgsRef) msgsRef.off();
  msgsRef=db.ref('chats/'+chatId+'/messages');
  const box=document.getElementById('msgs'); box.innerHTML='';
  msgsRef.limitToLast(200).on('child_added',snap=>{
    const m=snap.val(), d=document.createElement('div'); d.className='m '+(m.from===me.uid?'me':'th');
    const time=new Date(m.ts||Date.now()).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    if(m.type==='file'){
      d.innerHTML='<a class="file" href="'+m.url+'" target="_blank" rel="noopener"><span class="fi">📎</span><span>'+esc(m.name)+'<br><small>'+fmtSize(m.size)+'</small></span></a><span class="t">'+time+'</span>';
    } else { d.innerHTML=esc(m.text)+'<span class="t">'+time+'</span>'; }
    box.appendChild(d); box.scrollTop=box.scrollHeight;
  });
}
document.getElementById('snd').onclick=send;
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
function send(){
  const i=document.getElementById('txt'); const t=i.value.trim(); if(!t||!chatId) return;
  db.ref('chats/'+chatId+'/messages').push({from:me.uid,text:t,type:'text',ts:firebase.database.ServerValue.TIMESTAMP});
  db.ref('chats/'+chatId+'/meta').set({members:{[me.uid]:true,[peer]:true},lastText:t,lastTs:firebase.database.ServerValue.TIMESTAMP});
  i.value='';
}
document.getElementById('attach').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async(e)=>{
  const f=e.target.files[0]; if(!f||!chatId) return;
  if(f.size>20*1024*1024){ alert('Файл больше 20 МБ. Поддерживаются файлы меньшего размера.'); e.target.value=''; return; }
  const path='uploads/'+chatId+'/'+Date.now()+'_'+f.name;
  const ref=storage.ref(path);
  try{
    await ref.put(f);
    const url=await ref.getDownloadURL();
    db.ref('chats/'+chatId+'/messages').push({from:me.uid,type:'file',url,name:f.name,size:f.size,ts:firebase.database.ServerValue.TIMESTAMP});
    db.ref('chats/'+chatId+'/meta').set({members:{[me.uid]:true,[peer]:true},lastText:'📎 '+f.name,lastTs:firebase.database.ServerValue.TIMESTAMP});
  }catch(err){ alert('Не удалось загрузить файл: '+(err.message||err)); }
  e.target.value='';
};
</script></body></html>
